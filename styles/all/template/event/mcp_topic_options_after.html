{% if MAX_TOPIC_TITLE_LENGTH is defined %}
	<span class="hidden" data-customtitlelength-target="#subject" data-customtitlelength-max="{{ MAX_TOPIC_TITLE_LENGTH|e('html_attr') }}"></span>
	{% if not definition.INCLUDED_CUSTOMTITLELENGTH_JS %}
		{% INCLUDEJS '@vinny_customtitlelength/js/customtitlelength.js' %}
		{% DEFINE INCLUDED_CUSTOMTITLELENGTH_JS = true %}
	{% endif %}
{% endif %}
